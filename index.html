<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#212121">
    <title>SpeedChat</title>
    <!-- Твоя родная иконка -->
    <link rel="icon" type="image/png" href="icom.png">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --tg-bg: #0e1621;
            --tg-sidebar: #17212b;
            --tg-header: #17212b;
            --tg-msg-in: #182533;
            --tg-msg-out: #2b5278;
            --tg-text: #ffffff;
            --tg-hint: #6c7883;
            --tg-accent: #5288c1;
            --tg-hover: #202b36;
            --mirtex-purple: #9d4edd;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background: var(--tg-bg); color: var(--tg-text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Auth Screen */
        #auth { position: fixed; width: 100%; height: 100%; background: var(--tg-bg); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--tg-sidebar); padding: 30px; border-radius: 12px; width: 90%; max-width: 340px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        input { width: 100%; padding: 12px 15px; margin: 8px 0; border: none; border-radius: 8px; background: #242f3d; color: white; font-size: 15px; transition: 0.2s; }
        input:focus { background: #2a3949; }
        button { border: none; border-radius: 8px; background: var(--tg-accent); color: white; font-weight: 600; cursor: pointer; padding: 12px; margin-top: 15px; width: 100%; font-size: 15px; transition: 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.9; }

        /* Layout */
        .sidebar { width: 320px; background: var(--tg-sidebar); border-right: 1px solid #0e1621; display: flex; flex-direction: column; flex-shrink: 0; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 50; }
        .main-chat { flex: 1; display: flex; flex-direction: column; background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" xmlns="http://www.w3.org/2000/svg"%3E%3Cpath d="M0 0h100v100H0z" fill="%230e1621"/%3E%3Ccircle cx="20" cy="20" r="1" fill="%23151e27"/%3E%3Ccircle cx="80" cy="80" r="1" fill="%23151e27"/%3E%3C/svg%3E'); background-repeat: repeat; position: relative; width: 100%; }
        
        /* Header */
        #chat-header { background: var(--tg-header); padding: 10px 15px; font-weight: 600; color: var(--tg-text); display: flex; justify-content: space-between; align-items: center; height: 56px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); z-index: 10; }
        .menu-btn { display: none; font-size: 22px; cursor: pointer; padding: 5px; color: var(--tg-hint); }
        .header-info { display: flex; flex-direction: column; flex: 1; margin-left: 10px; }
        .header-name { font-size: 16px; font-weight: 600; }
        .header-status { font-size: 12px; color: var(--tg-accent); }

        /* Messages */
        #messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; scroll-behavior: smooth; }
        .msg { padding: 8px 12px; border-radius: 12px; max-width: 75%; word-wrap: break-word; line-height: 1.4; font-size: 15px; position: relative; animation: fadeIn 0.2s ease; box-shadow: 0 1px 1px rgba(0,0,0,0.1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .my-msg { align-self: flex-end; background: var(--tg-msg-out); color: white; border-bottom-right-radius: 4px; }
        .other-msg { align-self: flex-start; background: var(--tg-msg-in); color: #fff; border-bottom-left-radius: 4px; }
        
        .msg-time { font-size: 11px; opacity: 0.6; float: right; margin-left: 8px; margin-top: 4px; min-width: 35px; text-align: right; }

        /* Input Area */
        .input-area { background: var(--tg-header); padding: 8px 10px; display: flex; align-items: center; border-top: 1px solid #0e1621; }
        .input-area input { flex: 1; margin: 0; border-radius: 20px; padding: 10px 15px; background: #242f3d; }
        .send-btn { background: none !important; color: var(--tg-accent) !important; margin: 0 0 0 8px !important; width: 44px !important; height: 44px !important; padding: 0 !important; font-size: 24px !important; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: rgba(82, 136, 193, 0.1) !important; border-radius: 50%; }

        /* Sidebar Items */
        .chat-item { padding: 12px 15px; display: flex; align-items: center; cursor: pointer; transition: 0.2s; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .chat-item:hover, .chat-item.active { background: var(--tg-hover); }
        .avatar { width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(135deg, #5288c1, #9d4edd); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: white; margin-right: 12px; flex-shrink: 0; }
        .chat-info { flex: 1; overflow: hidden; }
        .chat-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-preview { font-size: 13px; color: var(--tg-hint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }

        /* Context Menu */
        #context-menu { position: absolute; background: var(--tg-sidebar); border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: none; flex-direction: column; overflow: hidden; z-index: 2000; min-width: 160px; border: 1px solid #2a3949; }
        .ctx-item { padding: 12px 16px; color: white; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.1s; }
        .ctx-item:hover { background: var(--tg-hover); }

        /* Mobile */
        @media (max-width: 768px) {
            .sidebar { position: absolute; height: 100%; transform: translateX(-100%); width: 85%; box-shadow: 5px 0 20px rgba(0,0,0,0.5); }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: block; }
            .msg { max-width: 85%; font-size: 16px; }
        }
    </style>
</head>
<body>

<!-- Auth Screen -->
<form id="auth" onsubmit="event.preventDefault(); handleAuth();" style="display:none;">
    <div class="auth-card">
        <img src="icom.png" width="70" style="margin-bottom:15px;">
        <h2 style="margin:0 0 5px 0;">SpeedChat</h2>
        <p style="font-size:13px; color:var(--tg-hint); margin-bottom:20px;">Быстро и надёжно</p>
        <input type="text" id="reg-name" placeholder="Имя">
        <input type="text" id="reg-id" placeholder="@username">
        <input type="password" id="reg-pass" placeholder="Пароль">
        <button type="submit">ВОЙТИ / РЕГИСТРАЦИЯ</button>
    </div>
</form>

<!-- Main App -->
<div id="app-content" style="display:none; width: 100%; display: flex;">
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div style="padding: 15px; display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #0e1621;">
            <span style="font-weight:bold; font-size:18px;">Чаты</span>
            <span onclick="toggleSidebar()" style="font-size:22px; cursor:pointer; color:var(--tg-hint);">✕</span>
        </div>
        <div style="padding: 10px 15px;">
            <input type="text" id="searchInput" placeholder="Поиск..." style="width:100%; margin:0; font-size:14px; padding:8px 12px; border-radius:20px;">
        </div>
        <div id="contacts-list" style="overflow-y:auto; flex:1;"></div>
        
        <!-- КНОПКА ПОДДЕРЖКИ "ТИПО ИИ" -->
        <div style="padding: 15px; border-top: 1px solid #0e1621; text-align: center;">
            <a href="https://t.me/progamfiles" target="_blank" 
               style="display: flex; align-items: center; justify-content: center; gap: 8px; 
                      color: var(--mirtex-purple); text-decoration: none; 
                      font-size: 14px; font-weight: 600; padding: 10px; 
                      background: rgba(157, 78, 221, 0.1); 
                      border-radius: 12px; transition: all 0.2s ease;">
                <span style="font-size: 18px;">✨</span>
                <span>Типо ИИ</span>
            </a>
            <div style="font-size: 11px; color: var(--tg-hint); margin-top: 5px;">
                @progamfiles • Solo Dev
            </div>
        </div>
    </div>
    
    <!-- Chat Area -->
    <div class="main-chat">
        <div id="chat-header">
            <span class="menu-btn" onclick="toggleSidebar()">☰</span>
            <div class="header-info" id="header-info">
                <div class="header-name">Выберите чат</div>
                <div class="header-status">чтобы начать общение</div>
            </div>
        </div>
        <div id="messages"></div>
        
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="Сообщение..." autocomplete="off">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>

<!-- Context Menu -->
<div id="context-menu">
    <div class="ctx-item" onclick="deleteMessage()">🗑️ Удалить у всех</div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = { databaseURL: "https://speedchat-3412e-default-rtdb.firebaseio.com/" };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let myId = "", myName = "", currentChat = null, selectedMsgKey = null;
    // ПАМЯТЬ МИРТЕКСА (хранится пока открыта вкладка)
    let mirtexMemory = { userName: null }; 

    window.onload = () => checkAuth();
    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }

    function checkAuth() {
        const savedId = localStorage.getItem('ldf_active_id');
        if (savedId) {
            myId = savedId;
            db.ref('users/' + myId + '/name').once('value', s => { myName = s.val() || myId; loginSuccess(); });
        } else { document.getElementById('auth').style.display = 'flex'; }
    }

    async function handleAuth() {
        const nI = document.getElementById('reg-name').value.trim() || "Пользователь";
        const iI = document.getElementById('reg-id').value.toLowerCase().replace('@','').trim();
        const ps = document.getElementById('reg-pass').value;
        if(!iI || !ps) return alert("Заполните все поля!");
        const userRef = db.ref('users/' + iI);
        const s = await userRef.once('value');
        if (s.exists()) {
            if (s.val().pass === ps) { myId = iI; myName = s.val().name; loginSuccess(); }
            else alert("Неверный пароль!");
        } else {
            await userRef.set({ name: nI, pass: ps });
            myId = iI; myName = nI; loginSuccess();
        }
    }

    function loginSuccess() {
        localStorage.setItem('ldf_active_id', myId);
        document.getElementById('auth').style.display = 'none';
        document.getElementById('app-content').style.display = 'flex';
        loadContacts();
    }

    function addContact(id, name, isBot = false) {
        const div = document.createElement('div');
        div.className = 'chat-item';
        const initial = name.charAt(0).toUpperCase();
        div.innerHTML = `<div class="avatar">${initial}</div><div class="chat-info"><div class="chat-name">${name}</div><div class="chat-preview">${isBot ? "Умный ИИ-ассистент v10.1" : "Нажмите, чтобы написать"}</div></div>`;
        div.onclick = () => {
            if(window.innerWidth <= 768) toggleSidebar();
            document.querySelectorAll('.chat-item').forEach(i => i.classList.remove('active'));
            div.classList.add('active');
            currentChat = id;
            document.querySelector('.header-name').innerText = name;
            document.querySelector('.header-status').innerText = isBot ? "бот • Ultra Smart" : "в сети";
            document.getElementById('messages').innerHTML = '';
            loadMessages();
        };
        document.getElementById('contacts-list').appendChild(div);
    }

    function loadContacts() {
        db.ref('users/' + myId + '/contacts').on('value', snap => {
            const list = document.getElementById('contacts-list');
            list.innerHTML = '';
            addContact('mirtex_bot', "Миртекс", true);
            if(snap.exists()) {
                snap.forEach(c => {
                    const id = c.key;
                    if(id !== 'mirtex_bot' && id !== myId) {
                        db.ref('users/' + id + '/name').once('value', s => addContact(id, s.val() || id));
                    }
                });
            }
        });
    }

    function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(text && currentChat) {
            const chatId = myId < currentChat ? `${myId}_${currentChat}` : `${currentChat}_${myId}`;
            db.ref('chats/' + chatId).push({ user: myId, text: text, timestamp: Date.now() });
            input.value = '';
            if (currentChat === 'mirtex_bot') triggerSuperMirtex(text, chatId);
        }
    }

    function loadMessages() {
        const chatId = myId < currentChat ? `${myId}_${currentChat}` : `${currentChat}_${myId}`;
        db.ref('chats/' + chatId).off();
        db.ref('chats/' + chatId).orderByChild('timestamp').on('child_added', snapshot => {
            const data = snapshot.val();
            const msgDiv = document.createElement('div');
            let className = data.user === myId ? 'my-msg' : 'other-msg';
            msgDiv.className = `msg ${className}`;
            const time = new Date(data.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            msgDiv.innerHTML = `${data.text.replace(/\n/g, '<br>')}<span class="msg-time">${time}</span>`;
            
            let pressTimer;
            const startPress = (e) => { e.preventDefault(); pressTimer = setTimeout(() => showContextMenu(e, snapshot.key, data.user), 500); };
            const endPress = () => clearTimeout(pressTimer);
            msgDiv.addEventListener('mousedown', startPress); msgDiv.addEventListener('touchstart', startPress);
            msgDiv.addEventListener('mouseup', endPress); msgDiv.addEventListener('touchend', endPress);
            
            document.getElementById('messages').appendChild(msgDiv);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        });
    }

    function showContextMenu(e, key, user) {
        const menu = document.getElementById('context-menu');
        menu.style.display = 'flex';
        let x = e.clientX || e.touches[0].clientX;
        let y = e.clientY || e.touches[0].clientY;
        if (x + 160 > window.innerWidth) x -= 160;
        menu.style.left = x + 'px'; menu.style.top = y + 'px';
        selectedMsgKey = key;
        document.querySelector('.ctx-item').style.display = (user === myId) ? 'flex' : 'none';
    }
    document.addEventListener('click', (e) => { if (!e.target.closest('#context-menu')) document.getElementById('context-menu').style.display = 'none'; });
    function deleteMessage() {
        if (!selectedMsgKey || !currentChat) return;
        const chatId = myId < currentChat ? `${myId}_${currentChat}` : `${currentChat}_${myId}`;
        db.ref('chats/' + chatId + '/' + selectedMsgKey).remove();
        document.getElementById('context-menu').style.display = 'none';
    }

    // ==========================================
    // МИРТЕКС V10.1 SECURE SMART (ИСПРАВЛЕННАЯ МАТЕМАТИКА)
    // ==========================================
    function triggerSuperMirtex(userMsg, chatId) {
        setTimeout(() => {
            const text = userMsg.toLowerCase().trim();
            let reply = "";
            const nameToUse = mirtexMemory.userName || "друг";

            // 1. ПАМЯТЬ И ИМЕНА
            const nameMatch = text.match(/(?:меня\s+зовут|мое\s+имя|я)\s+([а-яa-z]+)/i);
            if (nameMatch) {
                mirtexMemory.userName = nameMatch[1].charAt(0).toUpperCase() + nameMatch[1].slice(1);
                reply = `Приятно познакомиться, ${mirtexMemory.userName}! Я сохранил твоё имя в своей локальной памяти. 🧠`;
            }
            
            // 2. ПРОДВИНУТАЯ МАТЕМАТИКА (Ищет цифры в любом месте фразы)
            else if (text.includes("процент") || text.includes("%")) {
                const nums = text.match(/\d+/g);
                if (nums && nums.length >= 2) {
                    const percent = parseFloat(nums[0]);
                    const total = parseFloat(nums[1]);
                    const result = (percent / 100) * total;
                    reply = `🧮 ${percent}% от ${total} равно ${result}.`;
                }
            }
            else if (text.includes("корень")) {
                const num = text.match(/\d+/);
                if (num) {
                    const result = Math.sqrt(parseFloat(num[0]));
                    reply = ` Корень из ${num[0]} равен ${Number.isInteger(result) ? result : result.toFixed(4)}.`;
                }
            }
            // ИСПРАВЛЕНО: теперь проверяет наличие цифр и знаков в ЛЮБОМ месте строки
            else if (/\d/.test(text) && /[+\-*/^%]/.test(text)) {
                try { 
                    // Очищаем строку от букв, оставляем только математику
                    const clean = text.replace(/[а-яa-z\s]/gi, '').replace(/\^/g, '**');
                    const result = Function(`return (${clean})`)();
                    if (typeof result === 'number' && !isNaN(result)) {
                        reply = ` Результат вычисления: ${result}`;
                    } else {
                         reply = "Хм, это не похоже на обычный пример.";
                    }
                } catch(e) { reply = "❌ Не могу это посчитать. Проверь формулу."; }
            }

            // 3. 🔒 БЕЗОПАСНЫЙ ГЕНЕРАТОР ПАРОЛЕЙ (ТОЛЬКО ЛОКАЛЬНО!)
            else if (["пароль", "генератор", "придумай пароль"].some(w => text.includes(w))) {
                const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+-=";
                let pass = "";
                const array = new Uint32Array(16);
                window.crypto.getRandomValues(array);
                for(let i=0; i<16; i++) {
                    pass += chars.charAt(array[i] % chars.length);
                }
                
                reply = `🔐 Твой новый безопасный пароль (сгенерирован локально):\n\n${pass}\n\n⚠️ ВАЖНО: Скопируй его сейчас! Я не сохраняю пароли.`;
            }
            
            // 4. ГЕНЕРАТОР ЦВЕТОВ
            else if (["цвет", "hex"].some(w => text.includes(w))) {
                const hex = "#" + Math.floor(Math.random()*16777215).toString(16).padStart(6, '0');
                reply = `🎨 Случайный цвет: ${hex.toUpperCase()}`;
            }

            // 5. ЭМОЦИИ И ХАРАКТЕР
            else if (["тупой", "бесполезный", "отстой"].some(w => text.includes(w))) {
                reply = `🙄 Мой IQ выше, чем у твоего калькулятора, ${nameToUse}. Но я прощаю тебя.`;
            }
            else if (["спасибо", "благодарю", "красавчик"].some(w => text.includes(w))) {
                reply = `😊 Всегда пожалуйста, ${nameToUse}! Рад стараться.`;
            }
            else if (["грустно", "плохо", "устал"].some(w => text.includes(w))) {
                reply = `😟 Мне жаль, ${nameToUse}. Хочешь шутку или факт?`;
            }

            // 6. БАЗОВЫЕ КОМАНДЫ
            else if (["привет", "здравствуй", "хай"].some(w => text.includes(w))) 
                reply = `Привет, ${nameToUse}! Миртекс v10.1 Secure на связи. `;
            else if (["время", "час"].some(w => text.includes(w))) 
                reply = `⏰ Сейчас: ${new Date().toLocaleTimeString('ru-RU')}.`;
            else if (["дата", "день"].some(w => text.includes(w))) 
                reply = `📅 Сегодня: ${new Date().toLocaleDateString('ru-RU', {weekday:'long', day:'numeric', month:'long'})}.`;
            else if (["шутка", "анекдот"].some(w => text.includes(w))) {
                const jokes = [
                    "— Алло, это прачечная?\n— Нет, это программирование!",
                    "Программист ставит два стакана: один с водой, другой пустой.",
                    "Почему Java-разработчики носят очки? Потому что они не C#."
                ];
                reply = jokes[Math.floor(Math.random() * jokes.length)];
            }
            else if (["факт", "интересно"].some(w => text.includes(w))) {
                const facts = [
                    "Первый вирус Creeper появился в 1971 году.",
                    "90% интернета — это боты.",
                    "Символ @ использовали ещё в средние века."
                ];
                reply = facts[Math.floor(Math.random() * facts.length)];
            }
            else if (["помощь", "что умеешь"].some(w => text.includes(w))) 
                reply = `🛠️ Я умею:\n• Запоминать имя\n• Считать примеры и проценты\n• Генерировать пароли\n• Шутить и болтать`;

            // 7. ДЕФОЛТ
            else {
                const defaults = [
                    `Интересно, ${nameToUse}. Расскажи подробнее?`,
                    "Я обработал запрос. Давай глубже!",
                    "Понял тебя. Есть ещё задачи?",
                    "Мои алгоритмы анализируют это..."
                ];
                reply = defaults[Math.floor(Math.random() * defaults.length)];
            }

            db.ref('chats/' + chatId).push({ user: 'mirtex_bot', text: reply, timestamp: Date.now() });
        }, 400);
    }
</script>
</body>
</html>
